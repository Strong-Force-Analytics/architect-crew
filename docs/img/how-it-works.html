<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>How architect-crew works</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399;
      --accent: #eb6c36; --accent-tint: rgba(235,108,54,0.08); --rule: #bfc0c0;
      --sans: 'Geist', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1100px; }
    .scroll { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1040px; }
    .down { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .up { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
    .rule { stroke: var(--rule); stroke-width: 1; }
    .main { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .crew { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .tag { fill: none; stroke: var(--soft); stroke-width: 1; }
    .accent-tag { stroke: var(--accent); }
    .tag-text { fill: var(--soft); font: 500 9px var(--mono); letter-spacing: 0.08em; text-anchor: middle; }
    .accent-text { fill: var(--accent); }
    .main-name { fill: var(--accent); font: 600 18px var(--sans); text-anchor: middle; }
    .node-name { fill: var(--ink); font: 600 16px var(--sans); }
    .sub { fill: var(--soft); font: 400 11px var(--mono); }
    .sub.strong { fill: var(--muted); font-weight: 500; }
    .sub-center { fill: var(--muted); font: 400 11px var(--mono); text-anchor: middle; }
    .arrow-label { fill: var(--soft); font: 400 9px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
    .legend { fill: var(--muted); font: 400 11px var(--mono); }
  </style>
</head>
<body>
  <main class="frame">
    <div class="scroll">
    <svg viewBox="0 0 1040 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crew-title crew-desc">
      <title id="crew-title">How architect-crew works</title>
      <desc id="crew-desc">The main Opus session hands decided tasks to four cheaper subagents, scout, runner, builder and reviewer, and each sends back a short result: an answer, numbers, a diff or findings.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
      </defs>
      <rect width="1040" height="432" fill="#f5f5f5"/>
      <rect width="1040" height="432" fill="url(#dots)" opacity="0.55"/>

      <!-- Tasks down (solid), short results back up (dashed). -->
      <path class="down" d="M144 136 V246" marker-end="url(#arrow)"/>
      <path class="up" d="M176 248 V142" marker-end="url(#arrow-soft)"/>
      <path class="down" d="M384 136 V246" marker-end="url(#arrow)"/>
      <path class="up" d="M416 248 V142" marker-end="url(#arrow-soft)"/>
      <path class="down" d="M624 136 V246" marker-end="url(#arrow)"/>
      <path class="up" d="M656 248 V142" marker-end="url(#arrow-soft)"/>
      <path class="down" d="M864 136 V246" marker-end="url(#arrow)"/>
      <path class="up" d="M896 248 V142" marker-end="url(#arrow-soft)"/>
      <rect x="92" y="182" width="44" height="16" rx="4" fill="#f5f5f5"/><text x="114" y="194" class="arrow-label">TASK</text>
      <rect x="184" y="182" width="56" height="16" rx="4" fill="#f5f5f5"/><text x="212" y="194" class="arrow-label">ANSWER</text>

      <!-- The architect: the one focal node. -->
      <rect class="main" x="56" y="48" width="928" height="88" rx="6"/>
      <rect class="tag accent-tag" x="928" y="60" width="44" height="16" rx="2"/><text x="950" y="71.5" class="tag-text accent-text">OPUS</text>
      <text x="520" y="86" class="main-name">Main session</text>
      <text x="520" y="112" class="sub-center">plans the work, makes the decisions, reviews every diff</text>

      <!-- The crew -->
      <rect class="crew" x="56" y="248" width="208" height="96" rx="6"/>
      <rect class="tag" x="214" y="260" width="38" height="16" rx="2"/><text x="233.0" y="271.5" class="tag-text">HAIKU</text>
      <text x="72" y="276" class="node-name">scout</text>
      <text x="72" y="304" class="sub">reads files, searches code</text>
      <text x="72" y="324" class="sub strong">returns just the answer</text>
      <rect class="crew" x="296" y="248" width="208" height="96" rx="6"/>
      <rect class="tag" x="454" y="260" width="38" height="16" rx="2"/><text x="473.0" y="271.5" class="tag-text">HAIKU</text>
      <text x="312" y="276" class="node-name">runner</text>
      <text x="312" y="304" class="sub">runs tests, builds, scripts</text>
      <text x="312" y="324" class="sub strong">returns the numbers</text>
      <rect class="crew" x="536" y="248" width="208" height="96" rx="6"/>
      <rect class="tag" x="688" y="260" width="44" height="16" rx="2"/><text x="710.0" y="271.5" class="tag-text">SONNET</text>
      <text x="552" y="276" class="node-name">builder</text>
      <text x="552" y="304" class="sub">makes a decided edit</text>
      <text x="552" y="324" class="sub strong">returns a diff to review</text>
      <rect class="crew" x="776" y="248" width="208" height="96" rx="6"/>
      <rect class="tag" x="934" y="260" width="38" height="16" rx="2"/><text x="953.0" y="271.5" class="tag-text">HAIKU</text>
      <text x="792" y="276" class="node-name">reviewer</text>
      <text x="792" y="304" class="sub">checks a diff for defects</text>
      <text x="792" y="324" class="sub strong">returns findings only</text>

      <!-- Legend strip -->
      <line x1="56" y1="384" x2="984" y2="384" class="rule"/>
      <line x1="56" y1="408" x2="88" y2="408" class="down" marker-end="url(#arrow)"/>
      <text x="100" y="412" class="legend">hands over a task that is already decided</text>
      <line x1="440" y1="408" x2="472" y2="408" class="up" marker-end="url(#arrow-soft)"/>
      <text x="484" y="412" class="legend">sends back a short result, never the whole file</text>
    </svg>
    </div>
  </main>
</body>
</html>
